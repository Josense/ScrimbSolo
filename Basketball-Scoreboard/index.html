<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <div class="scoreboard">
            <div class="score-item">
                <h1>HOME</h1>
                <h2 id="home-score">0</h2>
                <div>
                    <button onclick="addscore(true, 1)">+1</button>
                    <button onclick="addscore(true, 2)">+2</button>
                    <button onclick="addscore(true, 3)">+3</button>
                </div>
            </div>
            
            <div class="score-item">
                <h1>GUEST</h1>
                <h2 id="guest-score">0</h2>
                <div>
                    <button onclick="addscore(false, 1)">+1</button>
                    <button onclick="addscore(false, 2)">+2</button>
                    <button onclick="addscore(false, 3)">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
        
    </body>
</html>
